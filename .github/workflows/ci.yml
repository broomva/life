name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/CLAUDE.md"
      - "**/AGENTS.md"
      - "**/CHANGELOG.md"
      - "docs/**"
      - "research/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/CLAUDE.md"
      - "**/AGENTS.md"
      - "**/CHANGELOG.md"
      - "docs/**"
      - "research/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Reduce dev-profile compile noise across the workspace. Release
  # builds (gate 11) override these via --release.
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: "1"

jobs:
  # ── Gate 1: Formatting ────────────────────────────────────────────
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ── Gate 2: Linting ───────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings -A clippy::too_many_arguments

  # ── Gate 3: Tests (Linux) ─────────────────────────────────────────
  #
  # Runner-death hardening (2026-06-11): this lane died on three
  # consecutive main pushes (and twice on PR #1693) with the
  # `cargo test --workspace` step ending in a NULL conclusion — the
  # runner agent itself was killed, not the tests. That is the
  # disk-exhaustion signature: a 125-crate workspace debug+test build
  # plus a multi-GB restored cache overruns the ~14 GB usable disk on
  # ubuntu-latest. Three mitigations, in order of leverage:
  #   1. CARGO_PROFILE_*_DEBUG=0 — debuginfo dominates target/ size
  #      (typically 50-70% of it); tests don't need DWARF on CI.
  #      debug-assertions are a separate knob and stay on.
  #   2. Shed ~10 GB of preinstalled runner bloat we never use.
  #   3. Bump the rust-cache lineage (v0 grew past usefulness; a fresh
  #      lineage caches the slimmer no-debuginfo artifacts).
  # macOS keeps full debuginfo — its runners have ~100 GB disk.
  test-linux:
    name: Test (Linux)
    needs: [format, lint]
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk (unused preinstalled toolchains)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/share/swift || true
          df -h /
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - run: cargo test --workspace
      - name: Disk headroom after tests
        if: always()
        run: df -h /

  # ── Gate 4: Tests (macOS) — post-merge only ──────────────────────
  #
  # Same rationale as Gate 11: macOS-latest runners are slower than
  # ubuntu and the test stage already takes ~12 minutes on macOS
  # (vs ~11 on Linux). Linux is the production target; macOS is a
  # cross-platform safety net. Running it on PR adds time without
  # catching anything Linux tests don't (in 99% of cases).
  #
  # Post-merge means: if a macOS-only regression lands, this catches
  # it within the first push, and we revert. Same trade-off as
  # Build Release.
  test-macos:
    name: Test (macOS)
    if: github.event_name == 'push'
    needs: [format, lint]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: brew install protobuf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # ── Gate 5: Minimum Supported Rust Version ────────────────────────
  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  # ── Gate 6: Security Audit ────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── Gate 7: Dependency Policy ─────────────────────────────────────
  deny:
    name: Dependency Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  # ── Gate 7b: lifed dependency rules (Spec C₂ §11) ────────────────
  verify-deps-lifed:
    name: Verify lifed dependency rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run scripts/verify_dependencies_lifed.sh
        run: bash scripts/verify_dependencies_lifed.sh

  # ── Gate 7c: lifegw dependency rules (Spec C₃ §11) ────────────────
  verify-deps-lifegw:
    name: Verify lifegw dependency rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run scripts/verify_dependencies_lifegw.sh
        run: bash scripts/verify_dependencies_lifegw.sh

  # ── Gate 7d: lifegw-anthropic-codec dependency rules (Spec J §12) ─
  verify-deps-lifegw-anthropic-codec:
    name: Verify lifegw-anthropic-codec dep rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run scripts/verify_dependencies_lifegw_anthropic_codec.sh
        run: bash scripts/verify_dependencies_lifegw_anthropic_codec.sh

  # ── Gate 7e: ergon dependency rules (Spec ergon-v0.1 §3) ──────────
  #
  # Ergon is the Layer-2 workflow primitive (see
  # `docs/architecture/agent-harness.md`). The dep-isolation rule is
  # stricter than lifed's: `ergon` is vendor-neutral (zero substrate
  # deps), `ergon-life-hooks` bridges only the 4 auto-hook substrates,
  # `ergon-life-sinks` depends only on lago-core + tracing. Violations
  # would silently couple the harness to a specific runtime and break
  # the abstraction. See BRO-1004 / ergon §12.10.
  verify-deps-ergon:
    name: Verify ergon dependency rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Self-test (regression guard for FAIL-path detection)
        run: bash scripts/verify_dependencies_ergon.sh --self-test
      - name: Run scripts/verify_dependencies_ergon.sh
        run: bash scripts/verify_dependencies_ergon.sh

  # ── Gate 7f: ergon — focused check + clippy + test ────────────────
  #
  # Dedicated fast lane for the ergon crate cluster (ergon +
  # ergon-life-hooks + ergon-life-sinks). The workspace lanes (Gates 1-3)
  # already cover these via `--workspace`, but a focused lane gives:
  #   - faster signal on PRs that only touch ergon (no waiting on the
  #     full workspace clippy / test pass)
  #   - explicit accountability if someone breaks ergon while editing
  #     a sibling crate (the workspace lanes fail but the source is
  #     ambiguous; this lane points at ergon)
  #   - an audit trail that ergon's three crates are individually
  #     fmt-clean, clippy-clean (with workspace-level `-D warnings`),
  #     and test-green at every PR
  #
  # See BRO-1004 / ergon §12.10 / `docs/architecture/ergon.md`.
  ergon-check:
    name: ergon — check + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check (ergon)
        run: cargo fmt -p ergon -p ergon-life-hooks -p ergon-life-sinks -- --check
      - name: Clippy (ergon, deny warnings)
        run: cargo clippy -p ergon -p ergon-life-hooks -p ergon-life-sinks --all-targets -- -D warnings -A clippy::too_many_arguments
      - name: Check (ergon)
        run: cargo check -p ergon -p ergon-life-hooks -p ergon-life-sinks --all-targets
      - name: Test (ergon, all features)
        run: cargo test -p ergon -p ergon-life-hooks -p ergon-life-sinks --all-features

  # ── Gate 8: Secret Scanning ───────────────────────────────────────
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # ── Gate 9: Conventional Commits ──────────────────────────────────
  commit-lint:
    name: Commit Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check PR title follows conventional commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Checking: $PR_TITLE"
          echo "$PR_TITLE" | grep -qE '^(feat|fix|chore|docs|refactor|test|ci|perf|build|style|revert)(\(.+\))?(!)?: .+' \
            || { echo "::error::PR title must follow conventional commits: <type>(<scope>): <subject>"; exit 1; }

  # ── Gate 9b: Life TypeScript SDK ──────────────────────────────────
  sdk-life-ts:
    name: SDK life-ts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/life-sdk-ts
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: TypeScript strict-mode check
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Production build
        run: bun run build

  # ── Gate 10: Console Frontend ─────────────────────────────────────
  console:
    name: Console Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/arcan/arcan-console/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: TypeScript check
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Production build
        run: bun run build

  # ── Gate 11: Release Build (post-merge only, not PR-blocking) ─────
  #
  # Why post-merge only: `cargo build --workspace --release` takes
  # ~21 minutes on this monorepo. Running on every PR added that to
  # the dev loop without catching anything tests didn't already
  # catch (debug builds + `cargo test --workspace` exercise every
  # crate's compilation path; release-specific issues are rare).
  #
  # By moving this to push-to-main only, PR feedback loop drops from
  # ~30+ min to ~12-14 min. If a release-only issue does land on
  # main, this canary catches it within the first push and we
  # revert. Trade-off favors dev velocity; canary keeps safety net.
  build:
    name: Build Release
    if: github.event_name == 'push'
    needs: [test-linux, test-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: Swatinem/rust-cache@v2
      - name: Install console deps
        run: cd crates/arcan/arcan-console/frontend && bun install --frozen-lockfile
      - run: cargo build --workspace --release
