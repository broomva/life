version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    # BRO-2814: one grouped PR for routine bumps instead of ten separate
    # ones hitting the same CI gates in parallel. Major bumps (API breaks)
    # stay ungrouped so they still get individual review.
    groups:
      cargo-patch-and-minor:
        update-types:
          - minor
          - patch
    # Majors (API breaks) are done deliberately, not via automated PRs.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
