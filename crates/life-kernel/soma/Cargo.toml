[package]
name = "soma"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Soma — Life Agent OS kernel daemon (privileged µVM hypervisor + admin CLI). Pairs with anima (identity)."
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "soma"
path = "src/lib.rs"

[[bin]]
name = "soma"
path = "src/main.rs"

[features]
default = ["vsock-listener"]
# vsock-listener is a no-op on non-Linux builds; the feature flag exists so
# downstream integrators can opt out without code changes.
vsock-listener = []
# BRO-1215 — Spec D D-Sub-E M9-E: opt in to the HashiCorp Vault Transit
# custody backend for the admin `CustodyOracle`. Default OFF so freelance
# / dev deploys keep using `InProcessCustodyKeys` without dragging in the
# Vault HTTP client. Production multi-tenant deploys enable this feature
# and select `[custody] backend = "vault"` in the soma config.
kms-vault = ["dep:anima-identity"]

[dependencies]
aios-protocol.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
lago-aios-eventstore-adapter.workspace = true
lago-core.workspace = true
lago-journal.workspace = true
life-kernel-core.workspace = true
life-kernel-gate.workspace = true
life-kernel-proto = { workspace = true, features = ["server", "client"] }
life-vigil.workspace = true
opentelemetry.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-stream.workspace = true
toml.workspace = true
tonic.workspace = true
tower.workspace = true
tempfile.workspace = true
tracing.workspace = true
hyper-util = { version = "0.1", features = ["tokio"] }
futures = { workspace = true }
parking_lot = { workspace = true }

# Spec D D-Sub-E: SO_PEERCRED + group lookup for the soma admin
# custody-oracle UDS. Same dep shape as lifegw's admin plane — `libc`
# carries the syscalls, `nix` adds the `getgrouplist` wrapper for
# supplementary groups (Linux only; macOS dev builds fall back to
# primary-gid checks).
libc = "0.2"
nix = { version = "0.31", default-features = false, features = ["user", "fs"] }

# Spec D D-Sub-E: in-process key store for CustodyOracle. The soma
# admin custody surface holds the (P-256 auth + secp256k1 wallet) key
# material per user. Operators may swap this for TPM via PKCS#11 or a
# custom HSM sidecar — the trait shape doesn't constrain backend
# choice (see SomaCustody's SPEC-D-DEVIATION block).
k256 = { workspace = true }
p256 = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
zeroize = { workspace = true }

anima-core.workspace = true
# BRO-1019: anima.v1.IdentitySubstrate codegen — wire-only; depends on
# aios-proto + tonic only.
anima-substrate-proto.workspace = true
# BRO-1215 — Spec D D-Sub-E M9-E: optional Vault Transit custody backend.
# anima-identity carries the `VaultTransitAnima` impl behind its own
# `kms-vault` feature; we mirror that gating so soma's default build
# stays slim. Pulls reqwest + tokio transitively only when the feature
# is on. (anima-identity isn't a workspace dep — every consumer pins
# via path, matching anima-lago / arcan-anima / lago-auth / haima-x402.)
anima-identity = { path = "../../anima/anima-identity", version = "0.3.0", optional = true, features = ["kms-vault"] }
hex = { workspace = true }
prost-types = "0.14"

arcan-provider-local.workspace = true

# vsock is Linux-only; this dep is excluded on other platforms so macOS dev
# builds remain green.  The `vsock-listener` feature still compiles cleanly
# everywhere; the listener implementation is gated by `#[cfg(target_os = "linux")]`.
[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = { version = "0.5", default-features = false }

[dev-dependencies]
# tempfile is in [dependencies] for production use (Bootstrap._lago_tempdir);
# no extra dev-only tempfile needed.
# (lifectl's old dev-dep tempfile entry collapses into this comment.)
# BRO-1019: e2e integration test driving the IdentitySubstrate wire
# through anima-proxy. Dev-only — production soma doesn't depend on
# anima-proxy (proxy is lifed-side).
anima-proxy = { workspace = true }

[lints]
workspace = true
