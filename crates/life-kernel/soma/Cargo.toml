[package]
name = "soma"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Soma — Life Agent OS kernel daemon (privileged µVM hypervisor + admin CLI). Pairs with anima (identity)."
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "soma"
path = "src/lib.rs"

[[bin]]
name = "soma"
path = "src/main.rs"

[features]
default = ["vsock-listener"]
# vsock-listener is a no-op on non-Linux builds; the feature flag exists so
# downstream integrators can opt out without code changes.
vsock-listener = []

[dependencies]
aios-protocol.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
lago-aios-eventstore-adapter.workspace = true
lago-core.workspace = true
lago-journal.workspace = true
life-kernel-core.workspace = true
life-kernel-gate.workspace = true
life-kernel-proto = { workspace = true, features = ["server", "client"] }
life-vigil.workspace = true
opentelemetry.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-stream.workspace = true
toml.workspace = true
tonic.workspace = true
tower.workspace = true
tempfile.workspace = true
tracing.workspace = true
hyper-util = { version = "0.1", features = ["tokio"] }
futures = { workspace = true }
parking_lot = { workspace = true }

# Spec D D-Sub-E: SO_PEERCRED + group lookup for the soma admin
# custody-oracle UDS. Same dep shape as lifegw's admin plane — `libc`
# carries the syscalls, `nix` adds the `getgrouplist` wrapper for
# supplementary groups (Linux only; macOS dev builds fall back to
# primary-gid checks).
libc = "0.2"
nix = { version = "0.31", default-features = false, features = ["user"] }

# Spec D D-Sub-E: in-process key store for CustodyOracle. The soma
# admin custody surface holds the (P-256 auth + secp256k1 wallet) key
# material per user. Operators may swap this for TPM via PKCS#11 or a
# custom HSM sidecar — the trait shape doesn't constrain backend
# choice (see SomaCustody's SPEC-D-DEVIATION block).
k256 = { workspace = true }
p256 = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
zeroize = { workspace = true }

anima-core.workspace = true
hex = { workspace = true }

arcan-provider-local.workspace = true

# vsock is Linux-only; this dep is excluded on other platforms so macOS dev
# builds remain green.  The `vsock-listener` feature still compiles cleanly
# everywhere; the listener implementation is gated by `#[cfg(target_os = "linux")]`.
[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = { version = "0.5", default-features = false }

[dev-dependencies]
# tempfile is in [dependencies] for production use (Bootstrap._lago_tempdir);
# no extra dev-only tempfile needed.
# (lifectl's old dev-dep tempfile entry collapses into this comment.)

[lints]
workspace = true
