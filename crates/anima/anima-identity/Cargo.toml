[package]
name = "anima-identity"
description = "Cryptographic identity for Life agents — Ed25519 auth + secp256k1 economics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
# Default: no external KMS — `InProcessAnima` only.
default = []
# Spec D D-Sub-B: HashiCorp Vault Transit backend (`VaultTransitAnima`).
# Pulls reqwest's blocking client + tokio time primitives. Mirrors the
# lifegw `kms-vault` feature pattern.
kms-vault = ["dep:reqwest", "dep:tokio"]
# Spec D D-Sub-D: TPM (PKCS#11) backend (`TpmAnima`).
# Pulls the `cryptoki` crate for PKCS#11 client bindings + the
# `secrecy` crate (used by cryptoki's `AuthPin = SecretString`).
# Default off; desktop deployments (mission-control on Linux/macOS)
# opt in via this feature. Mirrors the `kms-vault` gating pattern.
kms-tpm = ["dep:cryptoki", "dep:secrecy"]
# Spec D D-Sub-F: Ledger / Trezor hardware wallet backend
# (`HardwareWalletAnima`). Pulls `hidapi` for desktop HID transport;
# WebHID (browser) is intentionally out-of-scope for this feature and
# would land in a separate browser-side crate.
hw-wallet = ["dep:hidapi"]
# Spec D D-Sub-E: soma admin custody-oracle backend (`SomaCustody`).
# Pulls the tonic UDS client + life-kernel-proto generated types.
# Default off so non-soma deploys don't drag in the proto crate;
# production soma-fronted deployments enable this feature.
kms-soma = [
    "dep:tonic",
    "dep:tower",
    "dep:hyper-util",
    "dep:life-kernel-proto",
    "dep:tokio",
]

[dependencies]
anima-core.workspace = true
aios-protocol.workspace = true
haima-core.workspace = true
haima-wallet.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
blake3.workspace = true
uuid.workspace = true
ulid.workspace = true

# Ed25519
ed25519-dalek.workspace = true

# secp256k1 (shared with Haima)
k256.workspace = true

# P-256 (ES256) — Spec D L4-D6: anima auth keypair migrated from Ed25519
p256.workspace = true

# Key derivation + encryption
hkdf.workspace = true
sha2.workspace = true
sha3.workspace = true
chacha20poly1305.workspace = true
rand.workspace = true
zeroize.workspace = true

# JWT
jsonwebtoken.workspace = true
base64.workspace = true
hex.workspace = true
bs58.workspace = true

# Logging
tracing.workspace = true

# Spec D D-Sub-E: rotation/revocation modules + SomaCustody async paths.
async-trait = { workspace = true }
parking_lot = { workspace = true }

# Spec D D-Sub-B: Vault backend uses reqwest's blocking client + tokio
# for the optional token-renewal task. Both are workspace deps already
# pulled by lifegw; here we gate them behind `kms-vault` so a default
# build of anima-identity stays slim.
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

# Spec D D-Sub-D: TpmAnima uses cryptoki for PKCS#11 access to the host
# TPM. Default off — desktop deployments opt in via the `kms-tpm`
# feature; multi-tenant server-side deployments use `kms-vault` and
# never pull cryptoki.
cryptoki = { workspace = true, optional = true }
# secrecy is pulled by cryptoki transitively but we pin it as an
# optional dep so we can call `expose_secret()` on the AuthPin when
# threading the user PIN through `rotate()`. Same gate as cryptoki —
# default builds don't pull it.
secrecy = { workspace = true, optional = true }
# Spec D D-Sub-F: Ledger / Trezor hardware wallet via desktop HID. The
# `hw-wallet` feature pulls hidapi for the blocking, synchronous HID
# transport; the browser-side WebHID path is OUT OF SCOPE for this
# feature and would live in a separate crate.
hidapi = { workspace = true, optional = true }

# Spec D D-Sub-E: SomaCustody talks to soma's admin UDS via tonic.
# All gated behind `kms-soma` so a default build doesn't drag in the
# proto crate. tower/hyper-util are needed for the UDS connector.
tonic = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
life-kernel-proto = { workspace = true, optional = true, features = ["client"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
anima-lago.workspace = true
# Spec D D-Sub-B integration tests mock Vault's HTTP API to verify the
# request shapes (input encoding, marshaling_algorithm, latest_version
# pinning) without standing up a real Vault server. wiremock is already
# a workspace dev-dep used by lifegw's JWKS integration test.
wiremock = { workspace = true }
# Spec D D-Sub-E integration tests mock soma's admin custody-oracle on
# a tempdir UDS via tonic. tempfile + tokio-stream are needed for the
# UnixListener/incoming wiring; they don't pull into the production
# build.
tempfile = { workspace = true }
tokio-stream = { workspace = true }
