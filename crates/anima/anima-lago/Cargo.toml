[package]
name = "anima-lago"
description = "Lago persistence bridge for Anima — soul genesis, belief projection, self reconstruction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
anima-core.workspace = true
# Spec D D-Sub-E: rotation_events helper consumes
# `anima_identity::custody::DidRotationEvent`. anima-lago is the I/O
# boundary that turns rotation events into journal-appendable
# AnimaEventKind variants. The dep does NOT pull any kms-* features —
# we only need the trait + DidRotationEvent type.
anima-identity = { path = "../anima-identity", version = "0.3.0" }
aios-protocol.workspace = true
lago-core.workspace = true
lago-journal.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
blake3.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
