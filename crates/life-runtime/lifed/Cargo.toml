[package]
name = "lifed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "lifed — Life Runtime facade-aggregator daemon (M5)."
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "lifed"
path = "src/lib.rs"

[[bin]]
name = "lifed"
path = "src/main.rs"

[features]
default = []
# NOTE: The `failsafe-breaker` Cargo feature was removed in Sub-phase D
# code-quality review cleanup — it was dead code (no `#[cfg(feature = ...)]`
# anywhere). The hand-rolled breaker per Spec C₂ §7.2 is the M5 default and
# remains the only implementation. Sub-phase E will revisit if/when an
# alternative is wired in (likely via a separate `failsafe-rs` adapter crate
# rather than a feature flag).

[dependencies]
# wire / ABI
aios-protocol.workspace = true
aios-proto.workspace = true
life-kernel-proto = { workspace = true, features = ["client"] }
life-runtime-proto.workspace = true

# transport
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tower = { workspace = true }
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }

# concurrency / state
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "fs", "sync", "time"] }
tokio-stream = { workspace = true }
arc-swap = "1"
dashmap = "6"
parking_lot = "0.12"
async-trait.workspace = true
futures.workspace = true

# robustness
# (failsafe-rs experiment removed in Sub-phase D cleanup; see [features] note.)

# observability
life-vigil.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
# Sub-phase E: TraceContextPropagator for W3C traceparent injection on
# outgoing substrate calls.
opentelemetry_sdk.workspace = true

# auth
jsonwebtoken.workspace = true
serde.workspace = true
serde_json.workspace = true

# utility
anyhow.workspace = true
thiserror.workspace = true
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive", "env"] }
toml.workspace = true
sha2 = "0.10"
base32 = "0.5"
# admin-plane peer-cred extraction (SO_PEERCRED on Linux, getuid fallback elsewhere)
libc = "0.2"

# substrate proxy clients (real impls in sub-phase B; stubs in sub-phase A)
arcan-proxy.workspace = true
lago-proxy.workspace = true
haima-proxy.workspace = true
anima-proxy.workspace = true

# Sub-phase E: shared per-substrate pool + circuit-breaker primitives.
life-runtime-pool.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
tower-test = "0.4"
assert_matches.workspace = true
tonic-prost = "0.14"
lifed-conformance.workspace = true
async-trait.workspace = true
# Sub-phase E: enable the test-support helper (force_open_window_elapsed)
# for integration tests that drive the HalfOpen flow without waiting on
# the 10 s open timer.
life-runtime-pool = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
