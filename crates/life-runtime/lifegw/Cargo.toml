[package]
name = "lifegw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "lifegw — Life Runtime edge gateway daemon (M7). The only daemon with a public TCP socket: terminates TLS, verifies Tier-1 JWTs, mints Tier-2 capability tokens, forwards life.v1.* RPCs to lifed via UDS."
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "lifegw"
path = "src/lib.rs"

[[bin]]
name = "lifegw"
path = "src/main.rs"

[features]
# Default ships kms-vault as the production primary per Spec C₃ §16 #2.
# kms-aws / kms-gcp ship as opt-in. dev-mode is OFF in production —
# enabling it activates the `Bearer dev-token-for-{user_id}` shortcut.
default = ["kms-vault"]
# Production-recommended provider per Spec C₃ §5.4 + §16 #2.
# Activates the `VaultTransit` signer which uses reqwest's blocking
# HTTP client (already a dep for JWKS fetch).
kms-vault = []
# Sub-phase E completes the body of these providers.
kms-aws = []
kms-gcp = []
# Enables the in-process `Bearer dev-token-for-{user_id}` shortcut.
# OFF in production. Enabled in CI / unit tests via the
# integration_proxy_passthrough.rs rig.
dev-mode = []

[dependencies]
# wire / ABI — Spec C₃ §11.3: the only proto crate lifegw depends on.
aios-protocol.workspace = true
aios-proto.workspace = true
life-runtime-proto.workspace = true

# transport — tonic 0.14 + tonic-web for browser-compatible Connect protocol.
tonic = "0.14"
tonic-web = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tower = { workspace = true }
tower-http = { workspace = true }
http = "1"
http-body-util = "0.1"
bytes = { workspace = true }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }

# WebSocket support — Sub-phase C public-plane Agent.StreamSession bidi
# pump. tokio-tungstenite 0.26 (workspace pin) drives the upgrade dance
# atop a hyper::upgrade::Upgraded stream wrapped in TokioIo. We disable
# the workspace `native-tls` feature: lifegw terminates TLS itself via
# rustls (the WS lives on top of an already-decrypted socket), so the
# tungstenite-side TLS feature is unused. The `handshake` feature
# turns on `tungstenite::handshake::derive_accept_key` which we use to
# build the 101 Switching Protocols response without re-implementing
# the SHA-1 + base64 dance.
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

# TLS + (future) WS
#
# Sub-phase B decision (Spec C₃ §6, master spec §L4 invariant 1):
# TLS 1.3 ONLY. The `tls12` rustls feature is intentionally OFF so the
# gateway never negotiates TLS 1.2. Modern browsers + the Vercel edge
# support TLS 1.3; legacy clients are not part of lifegw's audience.
# Removing TLS 1.2 eliminates CBC-mode + RSA key-exchange + downgrade
# (POODLE-class) risk and aligns with the "asymmetric signing only"
# spirit of the master spec.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

# JWT mint + verify
jsonwebtoken.workspace = true
ring = "0.17"

# JWKS HTTP fetch (Sub-phase B). reqwest is already a transitive
# dependency of lifegw via life-vigil's OpenTelemetry stack — adding it
# explicitly here makes the dependency obvious and lets us pin the
# rustls-only TLS backend so the gateway doesn't pull native-tls. KMS
# providers (Sub-phase B's VaultTransit primary) also use reqwest.
reqwest = { workspace = true }

# concurrency / state
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "fs", "sync", "time", "io-util"] }
tokio-stream = { workspace = true }
arc-swap = "1"
async-trait.workspace = true
futures.workspace = true

# observability
life-vigil.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# utility
anyhow.workspace = true
thiserror.workspace = true
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive", "env"] }
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true }
base64 = { workspace = true }
# Atomic JWKS publish (write-tmp + rename) — see auth/bootstrap.rs.
tempfile = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
rcgen = "0.13"
tonic-prost = "0.14"
async-trait.workspace = true
# Sub-phase A integration test stands up a real lifed instance with mock
# substrates and proxies through lifegw. Allowed as a *dev*-dep only; the
# production crate graph never pulls lifed (Spec C₃ §11.2 dependency rules
# apply to the production graph, not test rigs — verify_dependencies_lifegw.sh
# checks `cargo tree`, which excludes dev-deps).
lifed = { path = "../lifed" }
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
# Sub-phase B integration test mounts a Vercel-style JWKS server at
# 127.0.0.1:0 to verify the real JWKS path end-to-end.
wiremock = { workspace = true }
# Sub-phase C integration test runs a tokio-tungstenite client over a
# pre-established rustls stream against the gateway's
# `/v1/agent/stream` endpoint to validate the bidi pump,
# reconnect-by-`last_seq_no`, and slow-consumer policy. The TLS
# handshake is performed by the test rig (matching the existing
# integration_proxy_passthrough.rs pattern); tungstenite's `handshake`
# feature provides `client_async` which consumes the established
# stream + builds the WebSocket framing on top.
futures-util = { workspace = true }

[lints]
workspace = true
