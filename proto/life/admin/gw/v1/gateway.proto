syntax = "proto3";

// life.admin.gw.v1 — operator + autonomic introspection of the
// lifegw edge gateway. New proto namespace introduced by Spec C₃ §3.6
// in M7 Sub-phase D (BRO-932 umbrella). Mounted on the admin UDS
// (`/run/life/lifegw-admin.sock`, group `life-admin`, mode `0660`),
// NEVER on the public TCP listener.
//
// Authn: SO_PEERCRED + group membership (`life-admin` group) — same
// pattern as lifed's life.admin.v1.Runtime service. NO bearer tokens
// on admin (the prompt's hard rule "Admin plane authn is SO_PEERCRED
// + group membership; NO bearer tokens").

package life.admin.gw.v1;

// Sub-phase E sweep (items #7, #8, #11): the original Sub-phase D proto
// imported `google/protobuf/timestamp.proto` for two `Timestamp` fields
// (BlocklistEntry.added_at + JwksKey.retired_at). Both have been
// simplified to direct u64 epoch-millis on the wire so the hot path
// doesn't round-trip through `prost_types::Timestamp`. The import is
// no longer needed.

service GatewayAdmin {
  // Liveness check. Anyone who can connect to the admin socket may
  // call this — it returns the daemon version.
  rpc HealthCheck(HealthReq) returns (HealthResp);

  // Sub-phase D D3: triggers SIGHUP-equivalent cert reload over RPC.
  // Operator (cert-manager / certbot) writes new cert files; calling
  // this RPC triggers an immediate ArcSwap-based reload of the rustls
  // ServerConfig. life-admin or root only.
  rpc CertReload(CertReloadReq) returns (CertReloadResp);

  // Sub-phase D D2: dump the current JWKS cache contents (kid + alg +
  // retired_at). Read-only — life-admin / autonomic / root.
  rpc JwksDump(JwksDumpReq) returns (JwksDumpResp);

  // Sub-phase D D2: in-memory IP/user blocklist management. Separate
  // from the rate limiter — the blocklist denies outright; the rate
  // limiter throttles. life-admin / root only.
  //
  // RPC names use PascalCase per buf-lint conventions (the prompt's
  // `Blocklist_Add` style is illegal under `RPC_PASCAL_CASE`). The
  // generated Rust client methods are still `blocklist_add` etc. so
  // call-site ergonomics are unchanged.
  rpc BlocklistAdd(BlocklistAddReq) returns (AdminAck);
  rpc BlocklistRemove(BlocklistRemoveReq) returns (AdminAck);
  rpc BlocklistList(BlocklistListReq) returns (BlocklistListResp);

  // Sub-phase D D2: runtime override of per-user QPS for a specific
  // user (e.g. throttle abusive caller without restart). Overrides
  // are in-process; restart resets to the configured defaults.
  // life-admin / root only.
  rpc RateLimitOverride(RateLimitOverrideReq) returns (AdminAck);
}

// Sub-phase E sweep (item #7): renamed from `BlocklistEmpty` →
// `AdminAck`. The original name conflated "empty body" (the actual
// semantics — every mutating admin op acknowledges with no payload)
// with "blocklist is empty". The new name is op-agnostic so future
// non-blocklist mutating ops can reuse it without further renames.
message AdminAck {}

message HealthReq {}

message HealthResp {
  bool ok = 1;
  string version = 2;
  // Best-effort reachability check on the lifed UDS — same shape as
  // /healthz returns to public-plane probes.
  bool lifed_reachable = 3;
  uint32 active_ws_connections = 4;
  uint32 jwks_cached_kids = 5;
}

message CertReloadReq {
  // Force re-read even if mtime unchanged (useful when the cert
  // rotation tool replaces files atomically with the same mtime).
  bool force = 1;
}

message CertReloadResp {
  bool reloaded = 1;
  // Number of certs in the freshly loaded chain. `0` indicates a
  // rejected reload (parse failed); the previous config stays live.
  uint32 cert_count = 2;
  // Human-readable reason on failure; empty on success.
  string reason = 3;
}

message JwksDumpReq {}
message JwksDumpResp {
  repeated JwksKey keys = 1;
}
message JwksKey {
  string kid = 1;
  string alg = 2;
  // `true` when the entry has been retired by a later refetch but is
  // still inside the rotation-grace window (Spec C₃ §5.3).
  bool retired = 3;
  // Sub-phase E sweep (item #8): `retired_at` aligned with the rest of
  // the admin proto wire format — u64 epoch-millis, no `prost_types`
  // round-trip. `0` means "not retired" (the `retired` bool is the
  // authoritative flag; this field is debug-aid metadata).
  uint64 retired_at_epoch_millis = 4;
  // Sub-phase E sweep (item #11): EC curve name (`P-256` for ES256,
  // `P-384` etc.). Empty for non-EC keys (RSA, etc.). Operational
  // triage signal — answers "is the cache holding the right curve for
  // the active alg?" without exposing key material.
  string crv = 5;
}

message BlocklistAddReq {
  // IPv4 / IPv6 literal (no CIDR yet; that's a Sub-phase E scope
  // expansion) OR `user:<user_id>` to block by Tier-1 sub claim.
  string subject = 1;
  string reason = 2;
}
message BlocklistRemoveReq { string subject = 1; }
message BlocklistListReq {}
message BlocklistListResp { repeated BlocklistEntry entries = 1; }
message BlocklistEntry {
  string subject = 1;
  string reason = 2;
  // Sub-phase E sweep (item #8): `added_at` is now wire u64 epoch-millis
  // instead of `google.protobuf.Timestamp` so the hot path no longer
  // round-trips through `prost_types::Timestamp` for every entry on
  // every list call. The value is computed against
  // `SystemTime::UNIX_EPOCH` and serialised directly.
  uint64 added_at_epoch_millis = 3;
}

message RateLimitOverrideReq {
  // Subject keyed in the limiter's user_id bucket, e.g. `user:abc123`
  // or just `abc123` (the gateway accepts both forms).
  string user_id = 1;
  // New token-bucket capacity; capacity 0 effectively blocks the
  // user (every request rejects until cleared via a subsequent call
  // with capacity > 0).
  uint32 capacity = 2;
  // Refill rate in tokens / second.
  uint32 refill_per_sec = 3;
}
